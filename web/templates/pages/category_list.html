{{define "content"}}
<div class="section-head">
  <h1>Categorias de produtos</h1>
  <a class="btn btn-primary" href="/categories/new">Nova categoria</a>
</div>
{{if .Data.Categories}}
<div class="table-wrap">
<table>
  <thead><tr><th>Nome</th><th>Descrição</th><th></th></tr></thead>
  <tbody>
  {{range .Data.Categories}}
    <tr>
      <td>{{.Name}}</td>
      <td>{{.Description}}</td>
      <td class="actions">
        <a href="/categories/{{.ID}}/edit">Editar</a>
        <form method="post" action="/categories/{{.ID}}/delete" class="inline" data-confirm="Excluir esta categoria?">
          {{template "csrf" $.CSRF}}
          <button type="submit" class="btn-link danger">Excluir</button>
        </form>
      </td>
    </tr>
  {{end}}
  </tbody>
</table>
</div>
{{else}}
<p class="empty">Nenhuma categoria cadastrada. Cadastre ao menos uma para criar produtos.</p>
{{end}}
{{end}}
